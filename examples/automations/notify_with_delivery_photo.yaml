# Notify with Amazon's proof-of-delivery photo once a parcel is delivered.
#
# Only Amazon's own fleet takes a photo: a parcel carried by a third party
# (Dragonfly, DHL, Colis Privé) has no ``delivery_photo_entity_id`` and this
# automation then sends the notification without an image rather than a
# broken one.
#
# The photo's image entity already exists when this event fires. Home
# Assistant serves it behind its own sign-in, so the companion app loads it
# with your account.

alias: "Amazon: delivered, with photo"
description: Notify when an Amazon parcel is delivered, including the delivery photo.
mode: queued
max: 10

triggers:
  - trigger: event
    event_type: amazon_orders_parcel_delivered

actions:
  - action: notify.mobile_app
    data:
      title: "Parcel delivered"
      message: >-
        {{ trigger.event.data.barcode }} – {{ trigger.event.data.raw_status or 'delivered' }}
      data:
        clickAction: "{{ trigger.event.data.url }}"
        image: >-
          {% set photo = trigger.event.data.raw.delivery_photo_entity_id %}
          {{ '/api/image_proxy/' ~ photo if photo else '' }}
